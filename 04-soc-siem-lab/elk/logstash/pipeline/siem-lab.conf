# TRACK B (documentation-only, not run in this sandbox — no Docker available).
# Parses the exact same log format log_generator.py emits and siem_ingest.py's
# regexes parse (see ../../siem_ingest.py LINE_RE / SSH_*_RE / UFW_BLOCK_RE)
# so Track A and Track B are provably ingesting the same schema.

input {
  beats {
    port => 5044
  }
}

filter {
  grok {
    match => {
      "message" => "^%{TIMESTAMP_ISO8601:ts} %{DATA:host} %{DATA:process}(?:\[%{NUMBER:pid}\])?: %{GREEDYDATA:msg}"
    }
  }

  date {
    match => ["ts", "ISO8601"]
    target => "@timestamp"
  }

  if [process] == "sshd" {
    if [msg] =~ "Failed password for invalid user" {
      grok {
        match => { "msg" => "Failed password for invalid user %{USERNAME:username} from %{IP:src_ip} port %{NUMBER:src_port} ssh2" }
        add_field => { "event_type" => "auth_failed" "valid_user" => "0" }
      }
    } else if [msg] =~ "Failed password for" {
      grok {
        match => { "msg" => "Failed password for %{USERNAME:username} from %{IP:src_ip} port %{NUMBER:src_port} ssh2" }
        add_field => { "event_type" => "auth_failed" "valid_user" => "1" }
      }
    } else if [msg] =~ "Accepted password for" {
      grok {
        match => { "msg" => "Accepted password for %{USERNAME:username} from %{IP:src_ip} port %{NUMBER:src_port} ssh2" }
        add_field => { "event_type" => "auth_success" "valid_user" => "1" }
      }
    }
  } else if [process] == "kernel" and [msg] =~ "UFW BLOCK" {
    grok {
      match => { "msg" => "SRC=%{IP:src_ip} DST=%{IP:dst_ip} .*PROTO=%{WORD:proto} SPT=%{NUMBER:src_port} DPT=%{NUMBER:dst_port}" }
      add_field => { "event_type" => "conn_block" }
    }
  }

  mutate {
    convert => { "src_port" => "integer" "dst_port" => "integer" "pid" => "integer" }
    remove_field => ["ts", "msg", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "siem-lab-events-%{+YYYY.MM.dd}"
  }
  # Uncomment while building the grok patterns above:
  # stdout { codec => rubydebug }
}
